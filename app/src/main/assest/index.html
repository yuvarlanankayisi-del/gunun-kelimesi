{id:'ipek-yolu',w:'İpek Yolu',c:['k'],def:'Çin\'i Akdeniz dünyasına bağlayan; ipeğin yanında fikirlerin de dolaştığı ticaret ağı.',origin:'Terim, 1877\'de Alman coğrafyacı Ferdinand von Richthofen tarafından "Seidenstraße" olarak kullanıldı. Tek bir yol değil, bir ağdı.',story:['İpek Yolu, tek bir yol değil, kara ve deniz bağlantılarından oluşan bir ağdı. İpeğin yanında kağıt, cam, baharat, din ve fikirler de bu ağ boyunca yayıldı.'],facts:['İpek Yolu adı, bu ağ işlerliğini yitirdikten çok sonra, 19. yüzyılda ortaya atıldı.'],src:['UNESCO, Silk Roads programı (en.unesco.org/silkroad)','en.wikipedia.org/wiki/Silk_Road'],intro:'Yüzyıllar boyunca farklı toplumları birbirine bağlayan ticaret ağının hikayesi.',outro:'Gördüğünüz çizgi, ağın tek bir olası hattıdır. Gerçekte birçok kol vardı.',stops:[{t:'Chang\'an (Xi\'an)',when:'Han dönemi',lat:34.34,lon:108.94,x:'Han döneminde başkent. Zhang Qian\'ın İ.Ö. 2. yüzyılda Batı\'ya gönderilen elçilik seferi, Çin\'in Orta Asya ile bağlantısını genişletti.'},{t:'Dunhuang',when:'Çölün kapısı',lat:40.14,lon:94.66,x:'Mogao Mağaraları\'ndaki el yazmaları ve duvar resimleri, yolun kültürel çeşitliliğini gösterir.'},{t:'Kaşgar',when:'Orta Asya eşiği',lat:39.47,lon:75.99,x:'Taklamakan Çölü\'nün kuzey ve güney kollarının birleştiği, dağ geçitleriyle Orta Asya\'ya çıkılan merkez.'},{t:'Semerkant',when:'Sogd tüccarları',lat:39.65,lon:66.96,x:'Sogdlu tüccarların önemli merkezi. Anlatıya göre kağıt yapımı Orta Asya\'ya 8. yüzyılda buradan yayıldı. Ayrıntılar tartışmalıdır.'},{t:'Antakya',when:'Roma dönemi',lat:36.2,lon:36.16,x:'Roma döneminde Doğu mallarının Akdeniz\'e açıldığı büyük şehirlerden biri.'}]},
{id:'el-yazmasi',w:'El yazması',c:['k'],def:'Matbaadan önce, elle çoğaltılan kitap ve metinler.',origin:'Latince manuscriptum (manu scriptus, "elle yazılmış") sözcüğünün Türkçe karşılığıdır.',story:['Matbaa yaygınlaşana kadar kitaplar katipler tarafından tek tek kopyalanıyordu. Bir kitabın nüshası kadar, kopyalayanın emeği de değerliydi.','Yaklaşık 1. ve 4. yüzyıllar arasında Roma dünyasında rulo yerini yavaş yavaş kodekse, yani sayfaları ciltlenmiş kitaba bıraktı.','Parşömen hayvan derisinden, kağıt bitki liflerinden yapılır. Kağıt Çin\'den İslam dünyası üzerinden Avrupa\'ya ulaştı.'],facts:['Avrupa\'da matbaa 1450\'li yıllarda kullanılmaya başladı. El yazması üretimi ondan sonra da uzun süre sürdü.'],src:['British Library, manuscripts guides','en.wikipedia.org/wiki/Manuscript'],stops:null},
{id:'tutsu',w:'Tütsü',c:['p','k'],def:'Yakıldığında koku ve duman yayan reçine, ağaç, kök ve otlar.',origin:'Tütmek (duman çıkarmak) fiilinden türetildiği düşünülür. Parfüm sözcüğünün Latince per fumum ("duman yoluyla") ifadesine bağlandığı sık anlatılır, ancak bu köken kesin değildir.',story:['Tütsü, ibadetlerde, saraylarda ve evlerde binlerce yıldır kullanılır. En tanınmış hammaddelerinden kündür, Boswellia ağaçlarının reçinesidir.','Umman\'ın Dhofar bölgesi ve Somali, kündür ağaçlarıyla tanınır. Arap Yarımadası\'ndan Akdeniz\'e uzanan tütsü ticareti, yol üzerindeki kentlerin gelişmesini sağladı.'],facts:['Negev\'deki tütsü yolu kentleri 2005\'te UNESCO Dünya Mirası listesine alındı.'],src:['UNESCO, Incense Route - Desert Cities in the Negev','en.wikipedia.org/wiki/Incense_route'],intro:'Çöllerden geçen kokulu bir ticaretin hikayesi.',outro:'Rota yaklaşıktır. Kervan yolları tek bir hat değildi.',stops:[{t:'Dhofar, Umman',when:'Kündür vadileri',lat:17.02,lon:54.09,x:'Kündür ağaçlarının yetiştiği kıyı bölgesi. Reçine buradan kervanlarla kuzeye taşındı.'},{t:'Petra',when:'Nabati kenti',lat:30.33,lon:35.44,x:'Nabatilerin ticaret merkezi. Çöl yollarının kavşağında zenginleşti.'},{t:'Gazze',when:'Akdeniz limanı',lat:31.5,lon:34.47,x:'Akdeniz limanı. Tütsü ve baharat buradan Akdeniz dünyasına dağıtıldı.'}]},
{id:'kiragi',w:'Kırağı',c:['w'],def:'Soğuk, açık gecelerde yüzeylerde oluşan ince buz kristalleri tabakası.',origin:'Türkçe bir sözcüktür. Ayrıntılı etimolojisi bu içerikte doğrulanmamıştır.',story:['Kırağı, havadaki su buharının sıcaklığı 0 derecenin altındaki yüzeylerde doğrudan buz kristallerine dönüşmesiyle oluşur. Bilimde buna depozisyon denir.','Genellikle açık, durgun ve soğuk gecelerde, yüzey hava sıcaklığından daha fazla soğuduğunda görülür.'],facts:['Kırağı düşen sabahlar, bitkiler için don riski taşıyan sabahlardır.'],src:['en.wikipedia.org/wiki/Hoarfrost','Meteoroloji kuruluşlarının sözlükleri'],stops:null},
{"id": "misk", "w": "Misk", "c": ["p"], "def": "Misk geyiğinden elde edilen yoğun ve kalıcı kokulu madde; bugün parfümcülükte sıcak, yumuşak, pudramsı bir koku ailesinin adı.", "origin": "Sanskritçe muṣka ('testis') ile ilişkilendirilir; Farsça mushk ve Arapça misk üzerinden Türkçeye geçtiği kabul edilir. Zincirin ayrıntıları tartışmalıdır.", "story": ["Geleneksel misk, erkek misk geyiğinin (Moschus cinsi) karın bölgesindeki bir bezde oluşan salgıdan elde edilirdi. Kurutulan salgı alkolde çözülerek parfüm ve ilaç yapımında kullanılırdı ve yüzyıllar boyunca çok değerli bir ticaret malı olarak taşındı.", "Misk geyiklerinin avlanması türleri tehdit altına soktu ve bugün bu hayvanların uluslararası ticareti sıkı denetim altında. 1888'de Albert Baur, TNT'nin daha etkili bir biçimini ararken tesadüfen ilk yapay miski buldu. Günümüz parfümlerinde kullanılan miskin büyük bölümü sentetiktir."], "facts": ["Bugün 'misk' parfümlerde çoğunlukla hayvansal bir maddeyi değil, sıcak ve pudramsı bir koku ailesini anlatır."], "src": ["Wikipedia: Musk ve Synthetic musk maddeleri", "Bristol Üniversitesi Kimya Bölümü, 'Molecule of the Month: Muscone'"], "stops": null},
{"id": "anber", "w": "Anber", "c": ["p"], "def": "İspermeçet balinasının sindirim sisteminde oluşan, denizde yıllarca olgunlaşıp kıyıya vuran mumsu madde; parfümlerde sabitleyici olarak değerlidir.", "origin": "Arapça anbar sözcüğünden gelir. Aynı sözcük 'amber' (kehribar) adının da kaynağıdır; bu yüzden iki farklı madde sık karıştırılır.", "story": ["Anber, ispermeçet balinasının sindirim sisteminde oluşan bir salgıdır. Balinadan dışarı atıldıktan sonra deniz yüzeyinde aylar, çoğu zaman yıllar boyunca güneş, tuz ve havayla olgunlaşır. İlk haldeki keskin koku zamanla yumuşar; tatlımsı, ılık ve denizsi bir kokuya dönüşür.", "Parfümcülükte anber, kokuyu ciltte uzun süre tutan bir sabitleyici olarak aranırdı. Bugün ürünlerin çoğunda anberin yerini sentetik moleküller (örneğin Ambroxan) alıyor."], "facts": ["Anberin ticaretine ilişkin kurallar ülkeden ülkeye değişir ve bazı ülkelerde kısıtlıdır."], "src": ["Wikipedia: Ambergris maddesi", "Encyclopaedia Britannica: Ambergris maddesi"], "stops": null},
{"id": "yasemin", "w": "Yasemin", "c": ["p"], "def": "Beyaz, yoğun kokulu çiçekleriyle tanınan bir bitki; çiçeklerinden elde edilen absolü parfümcülüğün en değerli çiçek kokularından biridir.", "origin": "Farsça yasamin sözcüğünden gelir ve Arapça üzerinden birçok dile yayılmıştır.", "story": ["Yasemin cinsinin (Jasminum) yüzlerce türü vardır. Parfümcülükte en çok J. grandiflorum ve J. sambac kullanılır. Çiçeklerin kokusu sabaha karşı ve erken saatlerde en yoğun olduğu için toplama genellikle bu saatlerde yapılır.", "Çiçeklerin kokusu hassas olduğundan buhar damıtması yerine genellikle solvent ekstraksiyonu veya eskiden enfleurage (yağda soğuk soğurma) kullanılır; çıkan ürüne absolü denir. Çiçekler elle toplanır ve bu işçilik maliyeti yükseltir.", "Fransa'nın Grasse kenti uzun zamandır yasemin ve gül yetiştiriciliğiyle parfümcülüğün merkezlerinden biri olarak bilinir."], "facts": ["J. sambac, Filipinler'de ('sampaguita') ve Endonezya'da ('melati putih') ulusal çiçek olarak kabul edilir.", "Grasse'daki parfümcülük bilgisi ve becerileri 2018'de UNESCO Somut Olmayan Kültürel Miras Temsili Listesi'ne alındı."], "src": ["Wikipedia: Jasmine maddesi", "UNESCO: Pays de Grasse'da parfümle ilgili beceriler (2018)"], "stops": null},
{"id": "lavanta", "w": "Lavanta", "c": ["p"], "def": "Mor çiçekleri ve ferah, otsu kokusuyla bilinen aromatik bitki; sabun, kolonya ve parfümlerde çok kullanılır.", "origin": "Kökeni tartışmalıdır. Latince lavare ('yıkamak') ile ya da livere ('morumsu mavi olmak') ile ilişkilendirilir; bu iki açıklama da kesin kabul edilmez.", "story": ["Lavanta uzun süredir banyo, çamaşır ve ilaç yapımında kullanılır. Lavandula cinsi Akdeniz çevresinden Hindistan'a uzanan geniş bir alanda yetişir. Fransa'nın Provence bölgesindeki lavanta tarlaları yaz aylarında çiçek açarak bölgenin simgelerinden biri oldu.", "Parfümcülükte lavanta yağı, çiçekli sapların buhar damıtmasıyla elde edilir. 'Fougère' koku ailesinin temel bileşenlerinden biridir."], "facts": ["Fougère 'eğrelti otu' demektir, ama bu ailenin kokusu eğrelti otundan değil; lavanta, meşe yosunu ve kumarin gibi bileşenlerin bir araya gelmesinden oluşur. Bu adı taşıyan ilk parfüm Houbigant'ın 1882 tarihli 'Fougère Royale'idir."], "src": ["Wikipedia: Lavandula maddesi", "Wikipedia: Perfume maddesi (koku aileleri bölümü)"], "stops": null},
{"id": "sandal-agaci", "w": "Sandal ağacı", "c": ["p"], "def": "Öz odunu yumuşak, kremsi ve sütsü kokusuyla bilinen, yavaş büyüyen ağaç; parfümcülükte taban nota olarak aranır.", "origin": "Sanskritçe candana ile ilişkilendirilir; sözcüğün başka dillere yayıldığı düşünülür. Ayrıntılar tartışmalıdır.", "story": ["Hint sandalı (Santalum album), Güney Hindistan'da yetişen ve uzun süre bu bölgenin simgelerinden olan bir türdür. Kokulu yağ, yıllarca büyümüş ağaçların öz odunundan damıtılır; bu yüzden ağaçların olgunlaşması onlarca yıl alır.", "Sandal ağacı dini törenlerde tütsü, macun ve yağ olarak, aynı zamanda geleneksel tıpta ve oymacılıkta kullanılmıştır. Aşırı toplama yüzünden Hint sandalı doğal ortamında tehdit altında kabul edilir ve Avustralya sandalı gibi alternatifler daha yaygın kullanılıyor."], "facts": ["Sandal ağacı yarı parazit bir bitkidir: kökleri başka bitkilerin köklerine tutunarak su ve besin alır, bu yüzden tek başına yetiştirmek zordur."], "src": ["Wikipedia: Sandalwood maddesi", "IUCN Kırmızı Liste: Santalum album"], "stops": null},
{"id": "od-agaci", "w": "Öd ağacı", "c": ["p"], "def": "Aquilaria ağaçlarında, yaralanma ve enfeksiyona karşı oluşan koyu, kokulu reçineli odun; tütsü ve parfümcülükte çok değerli sayılır.", "origin": "Arapça ud ('odun, ağaç') sözcüğünden gelir. Aynı sözcük telli çalgı ud'un da adıdır.", "story": ["Aquilaria ağaçları yaralandıklarında veya bazı mantar ve mikroorganizmalarla enfekte olduklarında, savunma olarak koyu ve reçineli bir doku üretir. Bu doku yoğun, dumanlı ve balsamik bir kokuya sahiptir. Sağlıklı odun açık renklidir ve belirgin kokmaz.", "Güney, Güneydoğu ve Doğu Asya ile Orta Doğu'da yüzyıllardır tütsü, ilaç ve parfüm olarak kullanılır. Doğal ağaçların aşırı toplanması yüzünden türler tehdit altındadır ve Aquilaria türlerinin uluslararası ticareti CITES kapsamında (Ek II) denetlenir."], "facts": ["Öd yağından yapılan parfümler 'oud' adıyla satılır ve Orta Doğu parfüm geleneğinde önemli bir yer tutar. Kaliteye göre fiyatı çok değişir."], "src": ["Wikipedia: Agarwood maddesi", "CITES Ek II: Aquilaria türleri"], "stops": null},
{"id": "vanilya", "w": "Vanilya", "c": ["p", "c"], "def": "Meksika kökenli bir orkide türünün olgunlaştırılmış meyvesinden (kapsülünden) elde edilen, tatlı ve sıcak kokulu baharat.", "origin": "İspanyolca vainilla ('küçük kın, küçük kapsül') sözcüğünden gelir; vaina ('kın, kılıf') sözcüğünün küçültme biçimidir.", "story": ["Vanilya, Meksika ve Orta Amerika'nın yerli bitkisidir; bölge halkları onu kullanıyordu ve İspanyollar 16. yüzyılda Avrupa'ya taşıdı. Bitkiyi Meksika dışında meyve verdirmek uzun süre başarılamadı, çünkü çiçeklerin Meksika dışında doğal tozlayıcısı yoktu.", "1841'de Réunion adasında, yaklaşık 12 yaşında köleleştirilmiş bir çocuk olan Edmond Albius, çiçeği elle tozlaştırmanın pratik bir yolunu buldu. Yöntem kısa sürede Madagaskar ve çevresine yayıldı ve bugün hala geçerlidir."], "facts": ["Vanilya, dünyanın en pahalı baharatlarından biri olarak anılır; çünkü çiçekler elle tozlaştırılır ve meyveler aylarca işlenir."], "src": ["Wikipedia: Vanilla ve Edmond Albius maddeleri", "Encyclopaedia Britannica: Vanilla maddesi"], "stops": [{"t": "Papantla, Meksika", "when": "Doğal ana yurt", "lat": 20.45, "lon": -97.32, "x": "Vanilya orkidesinin doğal ana yurdu Meksika ve Orta Amerika'dır. Geleneksel olarak Totonak halkı ile ve Papantla çevresi ile anılır."}, {"t": "Réunion", "when": "1841", "lat": -21.1, "lon": 55.5, "x": "Réunion adasında Edmond Albius, vanilya çiçeğini elle tozlaştırmanın yöntemini buldu. Bu buluş vanilyanın Meksika dışında da meyve vermesinin yolunu açtı."}, {"t": "Madagaskar", "when": "Sonraki on yıllar", "lat": -14.27, "lon": 50.17, "x": "Elle tozlaştırma yöntemi Madagaskar'ın kuzeydoğu kıyısında da uygulandı. Bugün Madagaskar dünyanın başlıca vanilya üreticisidir."}], "intro": "Bir orkide meyvesinin Meksika'dan Hint Okyanusu adalarına yolculuğu.", "outro": "Rota, bitkinin yayılışının başlıca basamaklarını gösterir; birebir gemi güzergahı değildir."},
{"id": "gul-yagi", "w": "Gül yağı", "c": ["p"], "def": "Taze gül yapraklarından damıtılarak elde edilen çok yoğun ve değerli esans; Isparta ve Bulgaristan'daki Kazanlık çevresi başlıca üretim merkezleri arasındadır.", "origin": "Gül sözcüğü Farsça gul'den Türkçeye geçmiştir.", "story": ["Parfümcülükte en çok Rosa damascena (şam gülü) ve Rosa centifolia kullanılır. Çiçekler kokusu en yoğun olan sabah saatlerinde, genellikle mayıs-haziran aylarında toplanır ve kısa sürede damıtılır.", "Çok az yağ elde etmek için çok büyük miktarda gül yaprağı gerekir; kaynaklara göre bir kilogram yağ için ton düzeyinde yaprak işlenir. Bu yüzden gül yağı en pahalı esanslardan biridir."], "facts": ["Türkiye ve Bulgaristan, dünya gül yağı üretiminde önde gelen ülkeler arasındadır."], "src": ["Wikipedia: Rose oil maddesi", "Wikipedia: Isparta ve Kazanlık (Gül Vadisi) maddeleri"], "stops": null},
{"id": "kolonya", "w": "Kolonya", "c": ["p"], "def": "Köln'de 18. yüzyılın başında ortaya çıkan, alkol, su ve narenciye ağırlıklı esanslardan yapılan hafif, ferah parfüm; Türkiye'de misafire ikram edilen bir gelenek.", "origin": "'Eau de Cologne' ('Köln suyu') ifadesinden gelir. Köln'ün adı ise Latince Colonia ('koloni') kökenlidir.", "story": ["Eau de Cologne'un 1709'da Köln'de İtalyan göçmen Giovanni Maria Farina tarafından geliştirildiği ve onun 'Acqua Admirabilis' adıyla sattığı karışımdan doğduğu anlatılır; ad sonradan şehrin adıyla yerleşti. Karışımın ferah, narenciyeli ve çiçeksi karakteri bergamot, limon ve neroli gibi esanslara dayanır.", "Türkiye'de kolonya, parfümden çok bir gündelik gelenek haline geldi: misafirlere el ve yüze sürmek üzere ikram edilir, bayram ziyaretlerinde ve sağlık ortamlarında kullanılır. En yaygını limon kolonyasıdır."], "facts": ["Eau de Cologne bir koku ailesinin adına dönüştü; günümüzde bu ad, düşük esans oranlı hafif parfümler için kullanılır."], "src": ["Wikipedia: Eau de Cologne maddesi", "Wikipedia: Giovanni Maria Farina maddesi"], "stops": null},
{"id": "akor", "w": "Akor", "c": ["p"], "def": "Parfümcülükte, iki veya daha fazla kokunun uyumlu biçimde birleşerek yarattığı tek ve bütünlüklü koku izlenimi.", "origin": "Fransızca accord ('uyum, anlaşma') sözcüğünden gelir; müzikteki akor ile aynı kökten gelir.", "story": ["Parfümcüler yeni bir koku oluştururken tek bir hammaddeyle değil, bir araya gelen birkaç hammaddenin yarattığı izlenimle çalışır. Örneğin gül ve odun, ayrı ayrı bilinen kokulardan farklı, yeni bir bütün oluşturabilir. Bu tür birleşimlere akor denir.", "19. yüzyılda İngiliz parfümcü Septimus Piesse kokuları bir müzik skalasındaki notalara benzetti. Bu yüzden nota, akor ve armoni gibi sözcükler hem müzikte hem parfümcülükte kullanılır."], "facts": ["'Üst, orta ve alt nota' kavramı bir parfümün zaman içinde nasıl açıldığını anlatır: ilk anlarda hafif ve uçucu kokular, sonra kalbi oluşturan çiçeksi veya baharatlı kokular, en sonunda kalıcı odunsu veya misk benzeri taban kokular algılanır."], "src": ["Wikipedia: Perfume maddesi (notalar bölümü)", "Wikipedia: Septimus Piesse maddesi"], "stops": null},
{"id": "espresso", "w": "Espresso", "c": ["c"], "def": "Çok sıcak suyun basınçla ince öğütülmüş kahveden hızla geçirilmesiyle hazırlanan, küçük hacimli ve yoğun kahve.", "origin": "İtalyanca espresso; 'hızlı' ve 'baskıyla çıkarılmış' anlamlarıyla açıklanır. İkisi de kullanılır, kesin köken tartışmalıdır.", "story": ["Kahveyi hızlı hazırlama arayışı 19. yüzyılın sonlarında İtalya'da buhar basıncıyla çalışan makinelere yol açtı. Torino'da Angelo Moriondo 1884'te buharlı bir kahve makinesinin patentini aldı. Milano'da Luigi Bezzera'nın 1901'deki geliştirmeleri makineyi kafelerde kullanılabilir hale getirdi; Desiderio Pavoni bu patenti satın alıp makineyi seri üretime taşıdı.", "Bugün bildiğimiz kremalı espresso ise 1940'larda Achille Gaggia'nın pistonlu makinesiyle yaygınlaştı: 8-10 bar civarındaki basınç, kahvenin üzerinde kalın bir köpük tabakası oluşturdu."], "facts": ["Espresso tek bir kahve türü değil, bir hazırlama yöntemidir; farklı çekirdekler ve kavurma dereceleriyle yapılabilir."], "src": ["Wikipedia: Espresso machine maddesi (Moriondo, Bezzera, Pavoni ve Gaggia bölümleri)", "Museo della Macchina per Caffè Espresso (MUMAC), Milano"], "stops": [{"t": "Torino", "when": "1884", "lat": 45.07, "lon": 7.69, "x": "Angelo Moriondo, buharla çalışan ve kahveyi 'anında' hazırlayan bir makine için 1884'te patent aldı. Makine tek tek fincanlar için değil, toplu servis için tasarlanmıştı."}, {"t": "Milano", "when": "1901 ve sonrası", "lat": 45.46, "lon": 9.19, "x": "Luigi Bezzera 1901'de makinede geliştirmeler yaptı. Desiderio Pavoni patenti satın aldı ve Milano'daki atölyesinde makineyi üretmeye başladı."}], "intro": "Bir içeceğin makineleşme hikayesi.", "outro": "Rota yaklaşıktır; makinelerin İtalya'dan dünyaya yayılışı çok daha karmaşıktı."},
{"id": "turk-kahvesi", "w": "Türk kahvesi", "c": ["c"], "def": "Çok ince öğütülmüş kahvenin cezvede su ve isteğe göre şekerle ağır ağır pişirilmesiyle hazırlanan, telveli ve köpüklü kahve.", "origin": "'Kahve' sözcüğü Arapça qahwa'dan Osmanlıca üzerinden Türkçeye girmiştir. Arapçadaki qahwa'nın kökeni tartışmalıdır.", "story": ["Kahve 16. yüzyılın ortalarında Osmanlı başkentine ulaştı ve kahvehaneler hızla yayıldı. Kahvenin cezvede, ince öğütülmüş halde suyla pişirilip telvesiyle servis edilmesi sonradan 'Türk kahvesi' diye anılmaya başlandı.", "Türk kahvesi içmek yalnızca bir içecek tüketmenin ötesinde bir ritüeldir: köpüğüyle servis, yanında su ve lokum, içtikten sonra fincanın kapatılıp fal bakılması. 'Türk kahvesi kültürü ve geleneği' 2013'te UNESCO Somut Olmayan Kültürel Miras Temsili Listesi'ne alındı."], "facts": ["Kız isteme törenlerinde damat adayına tuzlu kahve ikram edilmesi bir sınav olarak anlatılır. Bu bazı yörelerde bilinen bir gelenektir, her yerde uygulanmaz."], "src": ["UNESCO Somut Olmayan Kültürel Miras: Türk kahvesi kültürü ve geleneği (2013)", "Wikipedia: Turkish coffee maddesi"], "stops": null},
{"id": "cezve", "w": "Cezve", "c": ["c"], "def": "Türk kahvesini pişirmek için kullanılan, uzun saplı, genellikle bakır veya pirinçten yapılan küçük, dar boyunlu kap.", "origin": "Arapça cazwa ('közde yanan parça, ateş') ile ilişkilendirilir; Türkçeye Arapçadan geçtiği belirtilir.", "story": ["Cezvenin dar ağzı ve geniş tabanı kahvenin yavaş ısınmasını ve köpüğün tutulmasını sağlar. Bakır ısıyı hızlı iletir; iç yüzey genellikle kalaylıdır. Kahve kaynama noktasına yaklaşırken köpük yükselir ve cezve ateşten alınır.", "Benzer kaplar Balkanlar'da ve Orta Doğu'da farklı adlarla bulunur: örneğin ibrik, briki, džezva."], "facts": ["Cezve ile kahve pişirmenin bir yolu da ısıtılan kumun içinde pişirmektir. Bu yöntem bazı yörelerde ve kafelerde sürdürülür ve kahveye daha dengeli bir ısı verir."], "src": ["Wikipedia: Cezve maddesi", "UNESCO: Türk kahvesi kültürü ve geleneği"], "stops": null},
{"id": "kahvehane", "w": "Kahvehane", "c": ["c", "k"], "def": "Kahve içilen, sohbet edilen, oyun oynanan ve haberleşilen toplumsal mekan; Osmanlı şehir hayatında sosyal bir kurum haline geldi.", "origin": "'Kahve' ve Farsça -hane ('ev') sözcüklerinin birleşiminden oluşur.", "story": ["Osmanlı kaynaklarında İstanbul'daki ilk kahvehanelerin 16. yüzyılın ortalarında açıldığı anlatılır; Peçevi bunların Tahtakale'de ortaya çıktığını yazar. Kahvehaneler kısa sürede şairlerin, hikaye anlatıcılarının, satranç ve tavla oyuncularının buluşma yeri oldu. Bu yüzden 'mekteb-i irfan' (bilgi okulu) lakabıyla da anıldıkları söylenir.", "Toplanan insanlar ve konuşulan konular nedeniyle kahvehaneler zaman zaman yönetimin kuşkusunu çekti. 17. yüzyılda IV. Murad döneminde kahve, tütün ve kahvehanelere yasaklar getirildi, ancak bu yasaklar kalıcı olmadı."], "facts": ["Avrupa'da ilk kahvehaneler 17. yüzyılda açıldı. Londra'daki kahvehaneler, bir peni karşılığında sohbet ve haber edinilebildiği için 'penny üniversitesi' diye anılırdı."], "src": ["Wikipedia: Coffeehouse maddesi", "TDV İslam Ansiklopedisi: Kahvehane maddesi"], "stops": null},
{"id": "mokka", "w": "Mokka", "c": ["c"], "def": "Yemen'in Mokha limanından adını alan kahve ve ticaret merkezi; bugün aynı zamanda kahve ve çikolatalı bir içeceğin adı.", "origin": "Yemen'in Kızıldeniz kıyısındaki Mokha limanının adından gelir.", "story": ["15.-17. yüzyıllar boyunca Yemen dağlarında yetişen kahve Mokha limanından gemilere yüklendi. Bu dönemde kahve ticareti büyük ölçüde Yemen'in elindeydi. Avrupalı tüccarlar kahveyi bu limandan aldıkları için 'Mokka' adı kahvenin bir kalite adı olarak yayıldı.", "Sonraki yüzyıllarda Hollandalılar ve Fransızlar kahve fidanlarını başka kolonilere götürünce Mokha'nın önemi azaldı. Bugün 'mocha' adı kahve, süt ve çikolatanın karışımı olan içeceği de anlatır; bu kullanım Mokha kahvesinin çikolatamsı notalarıyla ilişkilendirilir."], "facts": ["Mokha limanı bugün hala Yemen'in Kızıldeniz kıyısında bir yerleşim olarak durur."], "src": ["Wikipedia: Mokha (Al Mukha) maddesi", "Wikipedia: History of coffee maddesi"], "stops": null},
{"id": "robusta", "w": "Robusta", "c": ["c"], "def": "Kahvenin Arabica'dan sonra en çok yetiştirilen türü; daha sert, acımsı ve kafeini yüksek.", "origin": "Latince robustus ('dayanıklı') sözcüğünden gelir. Bitkinin bilimsel adı Coffea canephora'dır; 'robusta' ticari addır.", "story": ["Robusta, Orta ve Batı Afrika kökenlidir ve Arabica'ya göre alçak rakımda, sıcak ve nemli iklimde yetişir. Hastalıklara ve sıcağa karşı daha dayanıklıdır, bu yüzden bu adı almıştır.", "Robusta tohumu Arabica'dan daha çok kafein içerir; kaynaklara göre yaklaşık iki katı. Bu yüzden tadı daha sert, acı ve dumanlıdır. Espresso karışımlarında gövdeyi ve kremayı artırmak için, hazır kahve ürünlerinde ise ekonomik nedenlerle kullanılır.", "Vietnam bugün dünyanın en büyük Robusta üreticisidir."], "facts": ["Robusta adı bir ticari addır; bitkinin bilimsel adı Coffea canephora'dır."], "src": ["Wikipedia: Coffea canephora maddesi", "Uluslararası Kahve Örgütü (ico.org)"], "stops": null},
{"id": "kavurma", "w": "Kavurma", "c": ["c"], "def": "Yeşil kahve çekirdeklerinin yüksek ısıda işlenerek kahverengileşmesi, kokusunun ve tadının ortaya çıkması.", "origin": "Türkçe kavur- fiilinden. Ayrıntılı kökeni bu içerikte doğrulanmadı.", "story": ["Ham kahve çekirdeği yeşildir, hafif otsu kokar ve tadı kahveye benzemez. Isıtıldıkça çekirdeklerdeki şeker ve amino asitler arasında Maillard tepkimesi başlar, renk kahverengiye döner ve yüzlerce koku molekülü oluşur.", "Kavurma sırasında çekirdekler iki kez çatlama sesi çıkarır: 'birinci çatlama' çekirdeğin içindeki buharın yol açtığı hafif bir patlamadır; 'ikinci çatlama' koyu kavurmalarda çekirdek yapısının parçalanmasıyla duyulur.", "Açık kavurma çekirdeğin asidik ve meyvemsi özelliklerini korur; koyu kavurma ise acımsı, dumanlı ve yağlı bir tat verir."], "facts": ["Kavurma sırasında çekirdek ağırlığının bir bölümünü (çoğunlukla suyu) kaybeder, hacmi ise artar."], "src": ["Wikipedia: Coffee roasting maddesi", "Wikipedia: Maillard reaction maddesi"], "stops": null},
{"id": "krema", "w": "Krema", "c": ["c"], "def": "Espresso'nun üzerinde oluşan, altın kahverengi ince köpük tabakası.", "origin": "İtalyanca crema ('krema, kaymak') sözcüğünden gelir.", "story": ["Krema, basınçla çekilen sıcak suyun kahvenin yağlarını emülsiyon haline getirmesi ve çözünmüş karbondioksiti ince kabarcıklar halinde serbest bırakmasıyla oluşur. Taze kavrulmuş kahve daha çok karbondioksit içerdiği için daha kalın krema verir.", "Krema, 1940'larda pistonlu makinelerle yaygınlaştı ve espresso'nun ayırt edici özelliği olarak görüldü. Kremanın tada katkısı konusunda ise görüşler farklıdır."], "facts": ["Robusta içeren karışımlar genellikle daha kalın ve kalıcı krema oluşturur."], "src": ["Wikipedia: Espresso maddesi (krema bölümü)", "Wikipedia: Espresso machine maddesi"], "stops": null},
{"id": "filtre-kahve", "w": "Filtre kahve", "c": ["c"], "def": "Öğütülmüş kahvenin üzerinden sıcak suyun bir filtreden damlayarak geçmesiyle hazırlanan kahve.", "origin": "Filtre sözcüğü Fransızca filtre'den gelir; Orta Çağ Latincesindeki filtrum ('keçe') ile ilişkilidir.", "story": ["Kağıt kahve filtresi 1908'de Dresden'de yaşayan Melitta Bentz tarafından bulundu. Kahveyi bezden torbalar ve delikli metal kaplarla süzmenin telve ve acı tat gibi sorunları vardı. Bentz'in, oğlunun defterinden aldığı kurutma kağıdını delikli bir pirinç kabın altına koyarak temiz, telvesiz bir kahve elde ettiği anlatılır.", "Bentz buluşu için Haziran 1908'de patent aldı ve aynı yıl şirketini kurdu. Melitta adı bugün hala kahve filtreleriyle anılır."], "facts": ["Kağıt filtre, kahvedeki yağları ve ince parçacıkları tutar; bu yüzden filtre kahvenin tadı daha berrak ve hafif olur."], "src": ["Alman Patent ve Marka Ofisi (DPMA): Melitta Bentz ve kahve filtresi", "Wikipedia: Melitta Bentz maddesi"], "stops": null},
{"id": "kahve-kirazi", "w": "Kahve kirazı", "c": ["c"], "def": "Kahve bitkisinin meyvesi; genellikle içinde iki tohum, yani bizim kahve çekirdeği dediğimiz şey bulunur.", "origin": "Türkçe adlandırma; İngilizce coffee cherry ('kahve kirazı') terimine karşılık gelir.", "story": ["Kahve çekirdeği botanik olarak bir tohumdur. Olgunlaşan kahve meyvesi kırmızı veya sarı olur ve kiraza benzer; bu yüzden 'kahve kirazı' denir. Meyvenin içinde genellikle birbirine bakan iki tohum bulunur; bazen tek, yuvarlak bir tohum gelişir ve buna 'peaberry' denir.", "Meyveden çekirdeğe giden işlem yönteme göre değişir. 'Yıkanmış' yöntemde meyve eti ayrılır ve fermantasyonla temizlenir; 'doğal' yöntemde meyve bütün olarak kurutulur. Bu fark kahvenin tadını belirgin biçimde etkiler."], "facts": ["Kuru kahve meyvesi kabuğundan yapılan 'cascara', bazı ülkelerde çay gibi demlenerek içilir."], "src": ["Wikipedia: Coffee cherry maddesi", "Wikipedia: Coffee processing maddesi"], "stops": null},
{"id": "parsomen", "w": "Parşömen", "c": ["k"], "def": "Hayvan derisinin işlenip inceltilmesiyle yapılan, yazı ve resim için kullanılan dayanıklı yazı malzemesi.", "origin": "Latince pergamina ('Bergama'ya ait') ile ilişkilendirilir; Fransızca parchemin üzerinden Türkçeye parşömen olarak geçmiştir.", "story": ["Parşömen, koyun, keçi veya buzağı derisinin yıkanıp kireçlenmesi, gerilip kazınması ve kurutulmasıyla yapılır. Papirüse göre daha dayanıklıdır, iki yüzüne de yazılabilir ve katlanarak kodeks biçiminde ciltlenebilir.", "Adı Antik Bergama kentiyle ilişkilendirilir. Anlatıya göre Mısır'ın papirüs ihracatını kısıtlaması üzerine Bergama'da parşömen geliştirildi. Ancak bu anlatı Romalı yazar Plinius'a dayanır ve tartışmalıdır: hayvan derisinin yazı için kullanımı Bergama'dan çok daha eskidir."], "facts": ["Bazı değerli yazmalarda eski yazı kazınıp silinerek parşömen yeniden kullanılırdı. 'Palimpsest' denen bu sayfaların altındaki silik yazı, günümüzde görüntüleme teknikleriyle okunabiliyor."], "src": ["Wikipedia: Parchment maddesi", "Encyclopaedia Britannica: Parchment maddesi"], "stops": null},
{"id": "papirus", "w": "Papirüs", "c": ["k"], "def": "Nil kıyısında yetişen bir sazlık bitkisinden yapılan, eski Mısır'da ve Akdeniz dünyasında yaygın yazı malzemesi.", "origin": "Yunanca papyros sözcüğünden gelir. İngilizce paper ve Fransızca papier gibi sözcükler bu kökten türemiştir.", "story": ["Papirüs bitkisinin (Cyperus papyrus) sap içi ince şeritler halinde kesilir, birbirine dik açılarla iki kat dizilir, preslenir ve kurutulur. Ortaya çıkan sayfalar birbirine eklenerek rulolar yapılırdı.", "Papirüsün Mısır'da kullanımı yaklaşık beş bin yıl öncesine uzanır. Mısır'ın kuru iklimi papirüslerin günümüze ulaşmasına yardımcı olmuştur."], "facts": ["Papirüsün yerini zamanla parşömen ve kağıt aldı."], "src": ["Wikipedia: Papyrus maddesi", "Encyclopaedia Britannica: Papyrus maddesi"], "stops": null},
{"id": "kodeks", "w": "Kodeks", "c": ["k"], "def": "Sayfaları bir kenarından dikilip ciltlenmiş kitap biçimi; bugünkü kitabın atası.", "origin": "Latince caudex/codex ('ağaç gövdesi, tahta blok, yazı tableti') sözcüğünden gelir.", "story": ["Roma döneminde yazı tabletleri tahta levhalardan yapılır ve birbirine bağlanırdı; 'kodeks' adı buradan kaldı. 1. yüzyıldan itibaren papirüs veya parşömen sayfalar da bu biçimde dikilmeye başlandı.", "Kodeksin ruloya göre avantajları vardı: istenen sayfa kolay bulunur, iki yüze de yazılabilir ve daha az yer kaplar. Erken Hristiyan toplulukları kodeksi yaygın biçimde kullandı; 4. yüzyıla gelindiğinde kodeks edebi metinlerde baskın hale geldi."], "facts": ["Kodeks biçimi, bir kitapta belli bir bölüme atlamayı kolaylaştırdı; ruloda bu çok zordu."], "src": ["Wikipedia: Codex maddesi", "Encyclopaedia Britannica: Codex maddesi"], "stops": null},
{"id": "tezhip", "w": "Tezhip", "c": ["k"], "def": "Yazma eserleri ve el yazması kitapları altın ve boyalarla süsleme sanatı.", "origin": "Arapça zeheb ('altın') kökünden gelir; 'altınlama' anlamındadır.", "story": ["Tezhip, Osmanlı kitap sanatlarının temel dallarından biridir. Sanatçılar, ince fırçalarla altın yaldız ve doğal pigmentleri kullanarak Kur'an yazmalarının, divanların ve fermanların sayfalarını, başlıklarını ve kenarlıklarını süsler.", "Avrupa'da benzer süsleme 'iluminasyon' (Latince illuminare, 'aydınlatmak') diye anılır. Adını, altınlı sayfaların ışıkla parlamasından aldığı söylenir."], "facts": ["Osmanlı sarayında kitap süslemeyle uğraşan sanatçılar saray nakkaşhanesinde çalışırdı."], "src": ["Wikipedia: Illuminated manuscript maddesi", "TDV İslam Ansiklopedisi: Tezhip maddesi"], "stops": null},
{"id": "ebru", "w": "Ebru", "c": ["k"], "def": "Suyun yüzeyine damlatılan boyaların kıvamlı bir sıvı üzerinde şekillendirilip kağıda aktarılmasıyla yapılan desen sanatı.", "origin": "Kökeni tartışmalıdır. Farsça ebr ('bulut') ile ya da ab-ru ('suyun yüzü') bileşimiyle ilişkilendirilir; ikisi de öne sürülür.", "story": ["Ebru yapımında suya kitre eklenerek kıvamlı bir zemin hazırlanır. Üzerine boyalar fırçayla damlatılır, bir çubuk veya tarakla şekillendirilir ve üstüne konulan kağıt desenin yüzeyini alır. Aynı desen bir daha tıpatıp yapılamaz.", "Ebru, Orta Asya, İran ve Anadolu'da uzun süredir yapılır; Osmanlı hat ve cilt sanatlarında da kullanılmıştır. UNESCO, 'Ebru, Türk kağıt süsleme sanatı'nı 2014'te Somut Olmayan Kültürel Miras Temsili Listesi'ne aldı."], "facts": ["Ebru desenleri ciltlerde ve defterlerin iç kapaklarında da kullanılır."], "src": ["UNESCO Somut Olmayan Kültürel Miras: Ebru, Türk kağıt süsleme sanatı (2014)", "Wikipedia: Ebru maddesi"], "stops": null},
{"id": "matbaa", "w": "Matbaa", "c": ["k"], "def": "Hareketli harflerle kitap basma tekniği ve bu işi yapan atölye.", "origin": "Arapça tab' ('basmak') kökünden matba'a sözcüğünden gelir.", "story": ["Johannes Gutenberg, 1450'li yıllarda Mainz'da hareketli metal harflerle ilk matbaasını kurdu. Teknik hızla yayıldı ve kitapların çoğaltılmasını kolaylaştırdı.", "Osmanlı topraklarında matbaa önce azınlık topluluklarınca kullanıldı: 15. yüzyılın sonlarında İstanbul'da İbranice basan bir matbaanın kurulduğu kaydedilir. Arap harfleriyle basım ise 18. yüzyılda İbrahim Müteferrika ile başladı. III. Ahmed döneminde, dini kitaplar hariç basım izniyle kurulan matbaanın ilk kitabı, 1729'da basılan Vankulu Lügati'dir. Dini kitapların basımı 1803'e kadar yasak kaldı."], "facts": ["Vankulu Lügati, Arapça-Türkçe bir sözlüktür ve iki cilt halinde basılmıştır."], "src": ["Wikipedia: İbrahim Müteferrika maddesi", "TDV İslam Ansiklopedisi: Darüttıbaa maddesi"], "stops": [{"t": "Mainz", "when": "1450'li yıllar", "lat": 50.0, "lon": 8.27, "x": "Gutenberg, hareketli metal harflerle kitap basma tekniğini Mainz'da geliştirdi. Matbaa buradan Avrupa'nın başka şehirlerine yayıldı."}, {"t": "İstanbul", "when": "1729: ilk Osmanlı Türkçesi kitap", "lat": 41.01, "lon": 28.98, "x": "İbrahim Müteferrika'nın matbaasında 1729'da Vankulu Lügati basıldı. Böylece Arap harfli Osmanlı Türkçesiyle basılan ilk kitap çıkmış oldu."}], "intro": "Bir icadın Avrupa'dan Osmanlı başkentine uzanan hikayesi.", "outro": "Matbaa başka yollarla da yayıldı; rota yalnızca iki önemli noktayı gösterir."},
{"id": "divan", "w": "Divan", "c": ["k"], "def": "Bir şairin şiirlerinin belli bir düzene göre toplandığı kitap; aynı zamanda Osmanlı'nın klasik şiir geleneğinin adı.", "origin": "Farsça divan sözcüğünden gelir; özgün anlamı 'kayıt defteri, yönetim kurulu, toplantı' gibidir.", "story": ["Divan edebiyatı, yaklaşık 14. ve 19. yüzyıllar arasında Osmanlı'da gelişen, Arap ve Fars edebiyatından beslenen klasik şiir geleneğidir. Baki, Fuzuli, Nedim ve Şeyh Galib bu geleneğin tanınmış isimleri arasındadır.", "Divanlar genellikle şiirleri nazım biçimine ve kafiye harfine göre sıralar: önce tevhid ve naat gibi dini şiirler, ardından kasideler ve gazeller gelir."], "facts": ["'Divan' sözcüğü aynı zamanda Osmanlı'da devlet işlerinin görüşüldüğü kurulun (Divan-ı Hümayun) adıdır. Kanepenin 'divan' adını almasının, bu kurulun minderli oturma düzeniyle ilişkili olduğu söylenir."], "src": ["Wikipedia: Ottoman poetry maddesi", "TDV İslam Ansiklopedisi: Divan edebiyatı maddesi"], "stops": null},
{"id": "destan", "w": "Destan", "c": ["k"], "def": "Bir toplumun kahramanlık, göç, savaş ve kuruluş anlatılarını çoğu zaman sözlü gelenekle aktaran uzun anlatı.", "origin": "Farsça dastan ('hikaye, öykü') sözcüğünden gelir.", "story": ["Türk dünyasının destan geleneğinde Oğuz Kağan, Manas ve Dede Korkut gibi anlatılar yer alır. Bunlar yüzyıllarca ağızdan ağıza aktarılmış, sonradan yazıya geçirilmiştir.", "Dede Korkut Kitabı'nın bilinen iki yazma nüshası vardır: Dresden nüshası on iki hikaye, Vatikan nüshası altı hikaye içerir. Metnin Oğuz geleneğine dayandığı ve yazıya 15.-16. yüzyıllarda geçirildiği kabul edilir."], "facts": ["Dresden nüshası, Saksonya Eyalet ve Üniversite Kütüphanesi'nde (SLUB) saklanır."], "src": ["Wikipedia: Book of Dede Korkut maddesi", "TDV İslam Ansiklopedisi: Dede Korkut maddesi"], "stops": null},
{"id": "ex-libris", "w": "Ex libris", "c": ["k"], "def": "Bir kitabın sahibini göstermek için iç kapağa yapıştırılan, resimli veya yazılı küçük etiket.", "origin": "Latince ex libris ('kitaplarından') ifadesi; genellikle sahibin adının önüne konur.", "story": ["Ex libris kitabın kime ait olduğunu gösterir. Avrupa'da 15. yüzyıldan itibaren kitap sahiplerinin kitaplarına ahşap baskı etiketler yapıştırdığı görülür; matbaanın yayılmasıyla bu uygulama arttı.", "Sonradan sanatçılar ex libris tasarlamaya başladı ve etiketler başlı başına koleksiyon nesnesi oldu. Etiketlerde sahibin ilgi alanını, mesleğini ya da sevdiği sembolleri gösteren motifler yer alır."], "facts": ["Bir kitabın eski sahiplerini izlemek ex libris'ler sayesinde mümkündür. Bu bilgiye 'provenans' (köken kaydı) denir."], "src": ["Wikipedia: Ex libris maddesi", "Encyclopaedia Britannica: Bookplate maddesi"], "stops": null},
{"id": "kolofon", "w": "Kolofon", "c": ["k"], "def": "El yazması bir kitabın sonunda, kopyacının adı, tarihi, yeri ve bazen bir dua ya da not içeren bölüm.", "origin": "Yunanca kolophon ('zirve, son dokunuş') sözcüğünden gelir; kitabın bitişini simgeler.", "story": ["Kolofon, el yazması dönemin 'imza ve künye' bölümüdür. Kopyacı eseri ne zaman, nerede ve kimin için tamamladığını yazar; bazen yorgunluğunu veya işin bitmesinin sevincini de ekler.", "Osmanlı ve İslam yazmalarında benzer bölüm 'ferağ kaydı' (tamamlama kaydı) olarak anılır. Bu kayıtlar yazmanın tarihini belirlemekte ve eserin hangi nüshadan çoğaltıldığını anlamakta kullanılır.", "Matbaa döneminde kolofonun işlevi büyük ölçüde kitabın başındaki künye sayfasına geçti; bugün 'kolofon' bazı yayınlarda kitabın sonundaki basım bilgisi için kullanılır."], "facts": ["Ortaçağ yazmalarında kopyacıların soğuktan, ışıktan veya elinin ağrımasından yakındığı notlara rastlanır."], "src": ["Wikipedia: Colophon (publishing) maddesi", "Encyclopaedia Britannica: Colophon maddesi"], "stops": null},
{"id": "kar-tanesi", "w": "Kar tanesi", "c": ["w"], "def": "Havadaki su buharının buz kristalleri halinde birleşmesiyle oluşan, altı kollu yapıya sahip kar parçası.", "origin": "Türkçe bileşik sözcük: kar + tane.", "story": ["Kar tanesi bir tek buz kristalinden oluşabilir; bulutlarda su buharı buz çekirdeklerinin üzerinde doğrudan donar. Su molekülünün yapısı yüzünden kristaller altı köşeli büyür.", "Kepler 1611'de 'Altı Köşeli Kar Tanesi Üzerine' adlı kısa bir risale yazdı; neden altı köşeli olduğunu sorgulayan ilk yazılardan biridir.", "Vermont'ta bir çiftçi olan Wilson Bentley, 15 Ocak 1885'te bir kar tanesinin ilk mikrofotoğrafını çekti ve hayatı boyunca binlerce kar tanesini görüntüledi."], "facts": ["Hiçbir iki kar tanesinin aynı olmadığı sık söylenir. Doğrusu, bir kar tanesinin ayrıntılı yapısının bir başkasıyla aynı olma ihtimalinin çok düşük olduğudur; bu iddia kesin olarak kanıtlanamaz."], "src": ["The Old Farmer's Almanac: Wilson Bentley", "Wikipedia: Snowflake maddesi"], "stops": null},
{"id": "buzul", "w": "Buzul", "c": ["w"], "def": "Karların yıllar içinde sıkışarak buza dönüşmesiyle oluşan ve kendi ağırlığıyla yavaş yavaş akan büyük buz kütlesi.", "origin": "Buz sözcüğünden türetilmiş bir Türkçe terimdir; ayrıntılı kökeni bu içerikte doğrulanmadı.", "story": ["Buzullar, yazın erimeyen karın yıllarca birikmesiyle oluşur. Üstteki kar alttaki tabakayı sıkıştırır ve zamanla yoğun buza dönüştürür. Yeterince kalınlaştığında buz kendi ağırlığıyla eğim yönünde akmaya başlar.", "Dünyadaki buz kütlelerinin büyük bölümü Antarktika ve Grönland'daki buz tabakalarında bulunur. Dağ buzulları Alpler, Himalayalar ve And Dağları gibi yerlerde görülür. Türkiye'de Ağrı Dağı ve Cilo-Sat Dağları'nda küçük buzullar vardır."], "facts": ["Buzul buzunun içinde sıkışmış hava kabarcıkları geçmiş atmosferin bileşimini ortaya çıkarır; bu yüzden buz karotları iklim tarihinin kaydı sayılır."], "src": ["Wikipedia: Glacier maddesi", "Ulusal Kar ve Buz Veri Merkezi (NSIDC): Glaciers"], "stops": null},
{"id": "cig", "w": "Çığ", "c": ["w"], "def": "Dağ yamacında biriken karın aniden kopup aşağı doğru hızla kayması.", "origin": "Türkçe çığ sözcüğü; ayrıntılı etimolojisi bu içerikte doğrulanmadı.", "story": ["Çığlar, yamaçtaki kar tabakalarının birbirine yeterince tutunamadığı durumlarda başlar. Sebepleri arasında yeni yağan yoğun kar, ani ısınma, rüzgarın kar taşıması ve yamaçta hareket eden insanlar sayılır. Çığlar en çok 30-45 derece eğimli yamaçlarda başlar.", "Kar tabakasının kopması, altındaki zayıf bir tabakanın varlığına bağlıdır. Bu zayıf tabaka zaman içinde değişen sıcaklık ve kristal yapısı yüzünden oluşabilir. Bu yüzden çığ tehlikesi bölge bölge ve gün gün değerlendirilir."], "facts": ["Avrupa'da çığ tehlikesi 1'den 5'e uzanan bir ölçekle duyurulur ve bültenler kış sporları bölgeleri için günlük yayımlanır."], "src": ["Wikipedia: Avalanche maddesi", "Avrupa Çığ Uyarı Servisleri (avalanches.org)"], "stops": null},
{"id": "kutup-isigi", "w": "Kutup ışığı", "c": ["w"], "def": "Kutup bölgelerinde gece gökyüzünde görülen yeşil, pembe ve mor renkli, dalgalanan ışık perdeleri.", "origin": "Türkçe adlandırma. Latince aurora borealis ('kuzey şafağı') adının Galileo'ya atfedildiği söylenir.", "story": ["Güneşten yayılan yüklü parçacıklar Dünya'nın manyetik alanıyla kutuplara yönlendirilir ve üst atmosferdeki oksijen ve azot atomlarına çarpar. Atomlar uyarılır ve enerjilerini ışık olarak bırakır. Yeşil renk genellikle oksijenden gelir.", "Kuzey yarım kürede 'aurora borealis', güney yarım kürede 'aurora australis' denir. En çok Alaska, Kanada, İzlanda, Norveç, İsveç ve Finlandiya'nın kuzeyinde görülür."], "facts": ["Güneş'in yaklaşık 11 yıllık aktivite döngüsünde en yoğun dönemlerde kutup ışıkları daha alçak enlemlerde de görülebilir."], "src": ["Wikipedia: Aurora maddesi", "NASA: Aurora"], "stops": null},
{"id": "gundonumu", "w": "Gündönümü", "c": ["w"], "def": "Güneş'in gökyüzünde gündüzün en kısa ya da en uzun olduğu noktaya ulaştığı iki zaman; kış gündönümü yılın en kısa gününe denk gelir.", "origin": "Türkçe bileşik sözcük: gün + dönüm. Latince solstitium ('güneşin durması') aynı fikri taşır.", "story": ["Kuzey yarım kürede kış gündönümü genellikle 21 veya 22 Aralık'ta olur. Bu tarihten sonra gündüzler yeniden uzamaya başlar. Dünya'nın dönme ekseninin eğik olması mevsimlerin sebebidir.", "Pek çok toplum yılın en karanlık gününü şenlikle karşılamıştır. İran'da Yalda Gecesi yılın en uzun gecesinde kutlanır; aileler nar, karpuz ve şiirle (özellikle Hafız'dan fal açarak) bir araya gelir."], "facts": ["Güney yarım kürede mevsimler tersidir; bu yüzden Aralık gündönümü orada yılın en uzun gününe karşılık gelir."], "src": ["Wikipedia: Winter solstice maddesi", "Wikipedia: Yalda Night maddesi"], "stops": null},
{"id": "cille", "w": "Çille", "c": ["w"], "def": "Anadolu geleneğine göre kışın en soğuk kabul edilen kırk günlük dönem.", "origin": "Farsça cille ('kırk') sözcüğünden gelir; 'çile' ile aynı kökten.", "story": ["Anadolu halk takviminde 'Büyük Çille' 22 Aralık'ta başlar ve 30 Ocak'ta biter. Ardından 'Küçük Çille' gelir ve yaklaşık yirmi gün sürer. Halk inancına göre çille çıkınca soğuğun kırılacağı düşünülür.", "Bu dönem için kışlık erzak hazırlanır; çille, kışın en çetin zamanını anlatan bir ölçü olarak dilde de yaşar."], "facts": ["'Çile çekmek' deyimi aynı kökten gelir: kırk günlük bir inzivadan doğan, sabır isteyen bir bekleyişin anlamı."], "src": ["TDK Güncel Türkçe Sözlük: çille maddesi", "TDV İslam Ansiklopedisi: Çille maddesi"], "stops": null},
{"id": "salep", "w": "Salep", "c": ["w"], "def": "Yabani orkide köklerinden elde edilen unumsu madde ve bu maddeyle yapılan, sıcak, sütlü, tarçınlı kış içeceği.", "origin": "Arapça sahlab sözcüğünden gelir; sözcüğün Arapçadaki 'tilki' anlamındaki bir kelimeyle ilişkili olduğu öne sürülür. Ayrıntılar tartışmalıdır.", "story": ["Salep, orkide türlerinin yumrularının kurutulup öğütülmesiyle yapılır. Süte ve şekere karıştırılıp kaynatılan salep, Türkiye'de özellikle soğuk kış günlerinde tarçınla içilen geleneksel bir içecektir. Kahramanmaraş, salebi ve dondurmasıyla anılır.", "Salep yumruları doğada yetişen orkidelerden toplandığı için bu bitkiler tehdit altındadır. Türkiye'de doğal orkide yumrularının toplanması ve ihracı yasal düzenlemelerle sınırlanmıştır."], "facts": ["Osmanlı şehirlerinde sokak satıcısı salepçilerin soğuk günlerde sıcak salep sattığı anlatılır."], "src": ["Wikipedia: Salep maddesi", "Food Reviews International, 2006: 'A Traditional Turkish Beverage: Salep'"], "stops": null},
{"id": "kis-uykusu", "w": "Kış uykusu", "c": ["w"], "def": "Bazı hayvanların kışın besin azaldığında vücut ısısını ve enerji harcamasını çok düşürerek uzun süre hareketsiz kalması.", "origin": "Latince hibernare ('kışı geçirmek') ve hiberna ('kış karargahı') sözcüklerinden gelen hibernasyon teriminin Türkçe karşılığıdır.", "story": ["Kış uykusuna yatan hayvanların kalp atışı ve solunumu belirgin biçimde yavaşlar, vücut ısıları düşer ve yaz boyunca biriktirdikleri yağ rezervlerini yavaş yavaş kullanırlar. Yarasalar, kirpiler, dağ sıçanları (marmot) ve yer sincapları bu gruba örnek gösterilir.", "Ayıların kışı geçirme biçimi uzun süre tartışıldı: vücut ısıları küçük hayvanlara kıyasla az düşer ama metabolizmaları belirgin biçimde yavaşlar. Bunu da bir kış uykusu biçimi saymayı tercih edenler vardır."], "facts": ["Kış uykusu kesintisiz bir uyku değildir; hayvanlar ara sıra uyanır ve bu kısa uyanıklık dönemleri enerjinin önemli bir bölümünü tüketebilir."], "src": ["Wikipedia: Hibernation maddesi", "Encyclopaedia Britannica: Hibernation maddesi"], "stops": null},
{"id": "iglo", "w": "İglo", "c": ["w"], "def": "Kar bloklarından yapılan kubbe biçimli kış barınağı; Orta Kanada Arktiği'nde bazı İnuit toplulukları tarafından kullanıldı.", "origin": "İnuit dillerindeki iglu ('ev, barınak') sözcüğünden gelir; yalnızca kardan yapılan evi değil, her tür evi anlatır.", "story": ["Kardan iglo, sıkıştırılmış karın yalıtkan özelliğinden yararlanır. Kar blokları kesilir, spiral halinde yukarı doğru dizilir ve üstte bir kubbe oluşturur. İçerideki ısı, dışarısı çok soğuk olsa da donma noktasının çok altına düşmez.", "Kardan iglolar yalnızca Orta Kanada Arktiği'ndeki bazı İnuit topluluklarının kış barınağıydı. İnuitlerin birçok bölgede evleri çimen, taş, kemik ve deri gibi malzemelerden yapılırdı."], "facts": ["Bugün kar iglolar çoğunlukla eğlence, hayatta kalma eğitimi ve turistik 'buz otel' gibi yapılar için kullanılıyor."], "src": ["Wikipedia: Igloo maddesi", "Encyclopaedia Britannica: Igloo maddesi"], "stops": null},
{"id": "kristal", "w": "Kristal", "c": ["w"], "def": "Atomların düzenli bir örgü içinde dizildiği katı madde; bu söz aslında 'buz' anlamına gelen eski bir Yunanca sözcükten türer.", "origin": "Yunanca krystallos ('buz, buza benzeyen berrak taş') sözcüğünden gelir; Latince crystallum üzerinden Avrupa dillerine yayıldı.", "story": ["Antik Yunanlılar dağlarda buldukları şeffaf, renksiz kuvars parçalarına krystallos, yani 'buz' diyordu. Romalı yazar Plinius, kaya kristalinin çok derin donmuş, bir daha çözülmeyen buz olduğunu yazar.", "Bu görüş yüzyıllarca yaşadı. Bugün kristal, atomların düzenli ve tekrarlanan bir örgü içinde dizildiği her katı madde için kullanılır. Buz da bu anlamda bir kristaldir, ama kaya kristali buz değildir."], "facts": ["Kar tanelerinin altı kollu yapısı, buz kristalinin altı köşeli örgü yapısından gelir."], "src": ["Wikipedia: Crystal ve Quartz maddeleri", "Plinius, Naturalis Historia, kitap 37"], "stops": null}
];
