<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Günün Kelimesi</title><style>
:root{--bg:#f6eedd;--card:#fffaf0;--ink:#3a2a1c;--mut:#7d6a55;--acc:#9a6b1f;--line:#e4d6bb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:1rem/1.55 Georgia,serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
main{flex:1;overflow:auto;padding:0}
.pad{padding:18px 20px}
nav{display:flex;border-top:1px solid var(--line);background:#fffaf0}
nav button{flex:1;padding:13px 0;background:none;border:0;color:var(--mut);font:600 .9rem Georgia;transition:color .3s}
nav button.on{color:var(--acc)}
nav button.on::after{content:"";display:block;width:22px;height:3px;border-radius:3px;background:var(--acc);margin:4px auto 0;animation:grow .35s}
h1,h2,h3{font-weight:normal;margin:0}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}to{width:22px}}
@keyframes slide{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(4.5);opacity:0}}
@keyframes sh{0%{background-position:-200% 0}100%{background-position:200% 0}}
.a1{animation:up .7s both}.a2{animation:up .7s .15s both}.a3{animation:up .7s .3s both}.a4{animation:up .7s .45s both}
.hm{position:relative;height:42%;min-height:230px;background:#cfe0e4}
.hm svg,#mp svg{width:100%;height:100%;display:block}
.hm::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.tb{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 18px;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:#4b3a28;z-index:2;text-shadow:0 0 6px #fff}
.pop{position:absolute;z-index:3;display:none;background:#fffaf0;border-radius:12px;padding:8px 14px;box-shadow:0 4px 14px #0004;transform:translate(-50%,-135%);animation:pp .25s both;line-height:1.3;min-width:190px}.pop small{color:var(--mut)}@keyframes pp{from{opacity:0}to{opacity:1}}
.org{position:absolute;left:16px;bottom:14px;z-index:2;background:rgba(255,250,240,.92);border-radius:14px;padding:4px 12px;font-size:.78rem;color:var(--acc);box-shadow:0 2px 8px #0002;animation:up .8s .8s both}
.hc{padding:2px 22px 18px}
.big{font-size:3.1rem;line-height:1.1;margin:6px 0 10px;color:var(--acc);word-break:break-word;letter-spacing:.02em}
.chip{display:inline-block;border:1px solid var(--acc);color:var(--acc);border-radius:20px;padding:2px 12px;font-size:.8rem}
.def{font-size:1.12rem;margin:14px 0}
.row{display:flex;gap:12px;align-items:center;margin-top:16px}
button{font-family:inherit}
.pri{background:var(--acc);color:#fff;border:0;border-radius:24px;padding:13px 26px;font-size:1rem;font-weight:bold;box-shadow:0 4px 12px #0003;transition:transform .15s}
.pri:active{transform:scale(.95)}
.ghost{background:#fffaf0;border:1px solid var(--line);color:var(--ink);border-radius:24px;padding:12px 18px;font-size:1rem}
.heart{background:none;border:0;font-size:1.9rem;color:#b9a68a;padding:6px 10px}
.heart.on{color:#d3523a;animation:pop .45s}
.item{background:var(--card);border-radius:14px;padding:14px 16px;margin:0 0 12px;border-left:4px solid var(--acc);box-shadow:0 2px 8px #6b4e2615;animation:up .5s both}
.item b{font-size:1.2rem;font-weight:normal;color:var(--acc)}.item small{color:var(--mut);display:block}
.empty{color:var(--mut);text-align:center;margin-top:60px;padding:0 20px}
.ov{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:5}
.ov.on{display:flex;animation:slide .4s both}
.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:#fffaf0}
.bar button{background:none;border:0;color:var(--acc);font-size:1rem;padding:8px}
.mini{height:170px;flex:none;position:relative;background:#cfe0e4}.mini svg{width:100%;height:100%;display:block}
.sec{margin:0 0 22px}.sec h3{color:var(--acc);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.sec p{margin:0 0 10px}.src{color:var(--mut);font-size:.85rem}
#mp{height:42%;flex:none;background:#cfe0e4;position:relative}
.sea{fill:#d3e3e7}.land{fill:#f2e3c3;stroke:#c9b184;stroke-width:1;vector-effect:non-scaling-stroke}
.dots{fill:none;stroke:#cdb27c;stroke-linecap:round;opacity:.85}
.grat{stroke:#fff;stroke-opacity:.5;stroke-width:1;vector-effect:non-scaling-stroke}
.rt{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.5s ease;vector-effect:non-scaling-stroke}
.rt.on{stroke-dashoffset:0}
.mk{fill:#b9a68a;stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke;transition:fill .5s}.mk.on{fill:var(--acc)}.mk.cur{fill:#d3523a}
.mo{fill:#d3523a;stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.rg{fill:none;stroke:#d3523a;stroke-width:2;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:ring 2.2s infinite}
.tv{fill:#fff;stroke:var(--acc);stroke-width:3;vector-effect:non-scaling-stroke}
.lb{fill:#3a2a1c;font-family:Georgia;stroke:#fffaf0;stroke-width:3;paint-order:stroke;stroke-linejoin:round}
.sc{flex:1;overflow:auto;padding:14px 20px}.sc h2{color:var(--acc);font-size:1.4rem}.sc small{color:var(--mut)}
.bd{display:inline-block;background:#d3523a;color:#fff;border-radius:12px;padding:1px 10px;font-size:.75rem;margin-left:8px;vertical-align:middle}
.ctl{display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--line);justify-content:space-between;background:#fffaf0}
button:disabled{opacity:.35}

{id:'kehribar',w:'Kehribar',c:['p'],def:'Milyonlarca yıl önce yaşamış ağaçların fosilleşmiş reçinesi.',origin:'Farsça kehrüba biçimiyle ilişkilendirilir. "Saman çeken" anlamından geldiği yorumu yaygındır, ancak köken kesin değildir.',story:['Kehribar bir taş değil, reçinedir. Baltık kehribarı, yaklaşık 40 milyon yıl öncesine, Eosen dönemine uzanan ormanlardan gelir.','Baltık kıyısı ile Akdeniz arasındaki kehribar ticareti tarih öncesi çağlara kadar uzanır. Bu bağlantılar sonradan "Kehribar Yolu" adıyla anılmıştır.','Eski Yunanlılar, yüne sürtülünce hafif cisimleri çeken bu maddeye elektron dedi. Elektrik sözcüğü bu kökten türetilmiştir.'],facts:['Kehribar, balinadan elde edilen anberden farklı bir maddedir.','Amber Room panelleri 1716\'da Prusya Kralı I. Friedrich Wilhelm tarafından Çar I. Petro\'ya armağan edildi.'],src:['Natural History Museum, amber üzerine genel bilgiler','en.wikipedia.org/wiki/Amber','Oxford English Dictionary, "electric" maddesi'],stops:null},
{id:'bergamot',w:'Bergamot',c:['p'],def:'Kabuğundan esans çıkarılan turunçgil; parfümlerde taze, hafif acımsı bir üst nota.',origin:'İtalyanca bergamotta üzerinden gelir. Türkçe "beg armudu" ile ilişkilendirilmesi öne sürülür, ancak köken tartışmalıdır.',story:['Bergamot (Citrus bergamia), ticari ölçekte neredeyse yalnızca İtalya\'nın Calabria bölgesinde, Reggio Calabria çevresindeki dar kıyı şeridinde yetiştirilir.','Kabuğundan soğuk sıkımla elde edilen esans, klasik kolonya ve parfüm karışımlarında üst nota olarak kullanılır.','Bitkinin kökeni tartışmalıdır. Turunçgil melezi olduğu öne sürülür.'],facts:['Earl Grey çayının karakteristik aroması bergamot yağından gelir.'],src:['en.wikipedia.org/wiki/Bergamot_orange','Consorzio del Bergamotto di Reggio Calabria'],intro:'Bergamotun dünyadaki ana yetiştirme alanı tek bir kıyı şeridi.',outro:'Tek bir bölge: Calabria. Bu yüzden rota değil, yalnızca bir konum var.',stops:[{t:'Calabria, İtalya',when:'Bugün',lat:38.1,lon:15.65,x:'Bergamot ağaçları Reggio Calabria çevresinde, deniz ile Aspromonte dağları arasındaki kıyı şeridinde yetişir. Ticari üretim bu bölgede yoğunlaşmıştır.'}]},
{id:'arabica',w:'Arabica',c:['c'],def:'Kahvenin en yaygın türü; Coffea arabica bitkisinin çekirdeği.',origin:'Bilimsel ad Coffea arabica, 1753\'te Linnaeus tarafından verildi. Arabica "Arabistan\'a ait" anlamına gelir.',story:['Arabica, güneybatı Etiyopya yaylalarında doğal olarak yetişen bir bitkidir. Dünyaya yayılışı birkaç basamakta anlatılabilir.'],facts:['Arabica dünya kahve üretiminin çoğunluğunu oluşturur. Diğer ana tür Robusta\'dır (Coffea canephora).'],src:['International Coffee Organization (ico.org)','en.wikipedia.org/wiki/Coffea_arabica'],intro:'Bir bitkinin Etiyopya yaylalarından dünyaya yolculuğu.',outro:'Rota, yayılışın başlıca basamaklarını gösterir. Birebir gemi güzergahı değildir.',stops:[{t:'Etiyopya yaylaları',when:'Doğal ana yurt',lat:7.7,lon:36.8,x:'Arabica bitkisinin doğal ana yurdu güneybatı Etiyopya yaylalarıdır. Yabani bitkiler hala burada yetişir.'},{t:'Mokha ve Yemen',when:'15. yüzyıl ve sonrası',lat:13.32,lon:43.25,x:'Kahve içmek 15. yüzyılda Yemen\'de Sufi çevrelerinde kayıtlara geçer. Mokha limanı yüzyıllarca kahve ihracatının merkezi oldu.'},{t:'İstanbul',when:'16. yüzyıl',lat:41.01,lon:28.98,x:'Osmanlı şehirlerinde kahvehaneler yaygınlaştı. Kahvenin Avrupa\'ya ulaşmasında Osmanlı ve Venedik ticaretinin payı vardır.'},{t:'Java',when:'17. yüzyıl sonu',lat:-6.2,lon:106.8,x:'Hollandalılar 17. yüzyılın sonunda Java\'da kahve plantasyonları kurdu.'},{t:'Pará, Brezilya',when:'1727',lat:-1.45,lon:-48.5,x:'1727\'de kahve fidanları Fransız Guyanası\'ndan Brezilya\'nın Pará bölgesine getirildi. Brezilya sonradan dünyanın en büyük kahve üreticisi oldu.'}]},
{id:'ipek-yolu',w:'İpek Yolu',c:['k'],def:'Çin\'i Akdeniz dünyasına bağlayan; ipeğin yanında fikirlerin de dolaştığı ticaret ağı.',origin:'Terim, 1877\'de Alman coğrafyacı Ferdinand von Richthofen tarafından "Seidenstraße" olarak kullanıldı. Tek bir yol değil, bir ağdı.',story:['İpek Yolu, tek bir yol değil, kara ve deniz bağlantılarından oluşan bir ağdı. İpeğin yanında kağıt, cam, baharat, din ve fikirler de bu ağ boyunca yayıldı.'],facts:['İpek Yolu adı, bu ağ işlerliğini yitirdikten çok sonra, 19. yüzyılda ortaya atıldı.'],src:['UNESCO, Silk Roads programı (en.unesco.org/silkroad)','en.wikipedia.org/wiki/Silk_Road'],intro:'Yüzyıllar boyunca farklı toplumları birbirine bağlayan ticaret ağının hikayesi.',outro:'Gördüğünüz çizgi, ağın tek bir olası hattıdır. Gerçekte birçok kol vardı.',stops:[{t:'Chang\'an (Xi\'an)',when:'Han dönemi',lat:34.34,lon:108.94,x:'Han döneminde başkent. Zhang Qian\'ın İ.Ö. 2. yüzyılda Batı\'ya gönderilen elçilik seferi, Çin\'in Orta Asya ile bağlantısını genişletti.'},{t:'Dunhuang',when:'Çölün kapısı',lat:40.14,lon:94.66,x:'Mogao Mağaraları\'ndaki el yazmaları ve duvar resimleri, yolun kültürel çeşitliliğini gösterir.'},{t:'Kaşgar',when:'Orta Asya eşiği',lat:39.47,lon:75.99,x:'Taklamakan Çölü\'nün kuzey ve güney kollarının birleştiği, dağ geçitleriyle Orta Asya\'ya çıkılan merkez.'},{t:'Semerkant',when:'Sogd tüccarları',lat:39.65,lon:66.96,x:'Sogdlu tüccarların önemli merkezi. Anlatıya göre kağıt yapımı Orta Asya\'ya 8. yüzyılda buradan yayıldı. Ayrıntılar tartışmalıdır.'},{t:'Antakya',when:'Roma dönemi',lat:36.2,lon:36.16,x:'Roma döneminde Doğu mallarının Akdeniz\'e açıldığı büyük şehirlerden biri.'}]},
{id:'el-yazmasi',w:'El yazması',c:['k'],def:'Matbaadan önce, elle çoğaltılan kitap ve metinler.',origin:'Latince manuscriptum (manu scriptus, "elle yazılmış") sözcüğünün Türkçe karşılığıdır.',story:['Matbaa yaygınlaşana kadar kitaplar katipler tarafından tek tek kopyalanıyordu. Bir kitabın nüshası kadar, kopyalayanın emeği de değerliydi.','Yaklaşık 1. ve 4. yüzyıllar arasında Roma dünyasında rulo yerini yavaş yavaş kodekse, yani sayfaları ciltlenmiş kitaba bıraktı.','Parşömen hayvan derisinden, kağıt bitki liflerinden yapılır. Kağıt Çin\'den İslam dünyası üzerinden Avrupa\'ya ulaştı.'],facts:['Avrupa\'da matbaa 1450\'li yıllarda kullanılmaya başladı. El yazması üretimi ondan sonra da uzun süre sürdü.'],src:['British Library, manuscripts guides','en.wikipedia.org/wiki/Manuscript'],stops:null},
