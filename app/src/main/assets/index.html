<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Günün Kelimesi</title><style>
:root{--bg:#1b1612;--card:#271f18;--ink:#f3ead9;--mut:#b5a58c;--acc:#c9a96a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:1rem/1.55 Georgia,serif}
#app{height:100%;display:flex;flex-direction:column}
main{flex:1;overflow:auto;padding:18px 20px}
nav{display:flex;border-top:1px solid #3a2f24;background:#15110d}
nav button{flex:1;padding:14px 0;background:none;border:0;color:var(--mut);font:600 .9rem Georgia}
nav button.on{color:var(--acc)}
h1,h2,h3{font-weight:normal;margin:0}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
.big{font-size:3rem;line-height:1.1;margin:10px 0;color:var(--acc);word-break:break-word}
.chip{display:inline-block;border:1px solid var(--acc);color:var(--acc);border-radius:20px;padding:2px 12px;font-size:.8rem}
.def{font-size:1.15rem;margin:16px 0}
.row{display:flex;gap:12px;align-items:center;margin-top:18px}
button{font-family:inherit}
.pri{background:var(--acc);color:#1b1612;border:0;border-radius:24px;padding:13px 24px;font-size:1rem;font-weight:bold}
.ghost{background:none;border:1px solid #4a3c2d;color:var(--ink);border-radius:24px;padding:12px 18px;font-size:1rem}
.heart{background:none;border:0;font-size:1.8rem;color:var(--mut);padding:6px 10px}
.heart.on{color:#d9694f}
.orn{margin:26px auto 6px;width:140px;color:var(--acc);opacity:.7}
.item{background:var(--card);border-radius:14px;padding:14px 16px;margin:0 0 12px;border-left:4px solid var(--acc)}
.item b{font-size:1.2rem;font-weight:normal}.item small{color:var(--mut);display:block}
.empty{color:var(--mut);text-align:center;margin-top:60px;padding:0 20px}
.ov{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:5}
.ov.on{display:flex}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #3a2f24}
.bar button{background:none;border:0;color:var(--acc);font-size:1rem;padding:8px}
.sec{margin:0 0 22px}.sec h3{color:var(--acc);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.sec p{margin:0 0 10px}.src{color:var(--mut);font-size:.85rem}
#mp{width:100%;height:40%;background:#14100c;flex:none}
.land{fill:#3a2f24;stroke:#5a4a38;stroke-width:1;vector-effect:non-scaling-stroke}
.grat{stroke:#2a2119;stroke-width:1;vector-effect:non-scaling-stroke}
.rt{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.4s ease;vector-effect:non-scaling-stroke}
.rt.on{stroke-dashoffset:0}
.mk{fill:#6b5a44;transition:fill .4s}.mk.on{fill:var(--acc)}.mk.cur{fill:#fff}
.ring{fill:none;stroke:var(--acc);stroke-width:2;vector-effect:non-scaling-stroke;animation:pl 1.6s infinite}
@keyframes pl{0%{opacity:.9}100%{opacity:0}}
.lb{fill:var(--ink);font-family:Georgia;opacity:.9}
.sc{flex:1;overflow:auto;padding:14px 20px}.sc h2{color:var(--acc);font-size:1.4rem}.sc small{color:var(--mut)}
.ctl{display:flex;gap:10px;padding:10px 16px;border-top:1px solid #3a2f24;justify-content:space-between}
button:disabled{opacity:.35}
</style></head><body><div id="app"><main id="m"></main><nav id="nv"></nav></div><div class="ov" id="ov"></div><div class="ov" id="st"></div><script>
const CATS={k:['Kitaplar ve edebiyat','#c9a96a'],p:['Parfüm ve koku','#c28ea0'],c:['Kahve kültürü','#b9835a'],w:['Kış','#8fb3c9']};
const W=[
{id:'kehribar',w:'Kehribar',c:['p'],def:'Milyonlarca yıl önce yaşamış ağaçların fosilleşmiş reçinesi.',origin:'Farsça kehrüba biçimiyle ilişkilendirilir. "Saman çeken" anlamından geldiği yorumu yaygındır, ancak köken kesin değildir.',story:['Kehribar bir taş değil, reçinedir. Baltık kehribarı, yaklaşık 40 milyon yıl öncesine, Eosen dönemine uzanan ormanlardan gelir.','Baltık kıyısı ile Akdeniz arasındaki kehribar ticareti tarih öncesi çağlara kadar uzanır. Bu bağlantılar sonradan "Kehribar Yolu" adıyla anılmıştır.','Eski Yunanlılar, yüne sürtülünce hafif cisimleri çeken bu maddeye elektron dedi. Elektrik sözcüğü bu kökten türetilmiştir.'],facts:['Kehribar, balinadan elde edilen anberden farklı bir maddedir.','Amber Room panelleri 1716\'da Prusya Kralı I. Friedrich Wilhelm tarafından Çar I. Petro\'ya armağan edildi.'],src:['Natural History Museum, amber üzerine genel bilgiler','en.wikipedia.org/wiki/Amber','Oxford English Dictionary, "electric" maddesi'],stops:null},
{id:'bergamot',w:'Bergamot',c:['p'],def:'Kabuğundan esans çıkarılan turunçgil; parfümlerde taze, hafif acımsı bir üst nota.',origin:'İtalyanca bergamotta üzerinden gelir. Türkçe "beg armudu" ile ilişkilendirilmesi öne sürülür, ancak köken tartışmalıdır.',story:['Bergamot (Citrus bergamia), ticari ölçekte neredeyse yalnızca İtalya\'nın Calabria bölgesinde, Reggio Calabria çevresindeki dar kıyı şeridinde yetiştirilir.','Kabuğundan soğuk sıkımla elde edilen esans, klasik kolonya ve parfüm karışımlarında üst nota olarak kullanılır.','Bitkinin kökeni tartışmalıdır. Turunçgil melezi olduğu öne sürülür.'],facts:['Earl Grey çayının karakteristik aroması bergamot yağından gelir.'],src:['en.wikipedia.org/wiki/Bergamot_orange','Consorzio del Bergamotto di Reggio Calabria'],intro:'Bergamotun dünyadaki ana yetiştirme alanı tek bir kıyı şeridi.',outro:'Tek bir bölge: Calabria. Bu yüzden rota değil, yalnızca bir konum var.',stops:[{t:'Calabria, İtalya',when:'Bugün',lat:38.1,lon:15.65,x:'Bergamot ağaçları Reggio Calabria çevresinde, deniz ile Aspromonte dağları arasındaki kıyı şeridinde yetişir. Ticari üretim bu bölgede yoğunlaşmıştır.'}]},
{id:'arabica',w:'Arabica',c:['c'],def:'Kahvenin en yaygın türü; Coffea arabica bitkisinin çekirdeği.',origin:'Bilimsel ad Coffea arabica, 1753\'te Linnaeus tarafından verildi. Arabica "Arabistan\'a ait" anlamına gelir.',story:['Arabica, güneybatı Etiyopya yaylalarında doğal olarak yetişen bir bitkidir. Dünyaya yayılışı birkaç basamakta anlatılabilir.'],facts:['Arabica dünya kahve üretiminin çoğunluğunu oluşturur. Diğer ana tür Robusta\'dır (Coffea canephora).'],src:['International Coffee Organization (ico.org)','en.wikipedia.org/wiki/Coffea_arabica'],intro:'Bir bitkinin Etiyopya yaylalarından dünyaya yolculuğu.',outro:'Rota, yayılışın başlıca basamaklarını gösterir. Birebir gemi güzergahı değildir.',stops:[{t:'Etiyopya yaylaları',when:'Doğal ana yurt',lat:7.7,lon:36.8,x:'Arabica bitkisinin doğal ana yurdu güneybatı Etiyopya yaylalarıdır. Yabani bitkiler hala burada yetişir.'},{t:'Mokha ve Yemen',when:'15. yüzyıl ve sonrası',lat:13.32,lon:43.25,x:'Kahve içmek 15. yüzyılda Yemen\'de Sufi çevrelerinde kayıtlara geçer. Mokha limanı yüzyıllarca kahve ihracatının merkezi oldu.'},{t:'İstanbul',when:'16. yüzyıl',lat:41.01,lon:28.98,x:'Osmanlı şehirlerinde kahvehaneler yaygınlaştı. Kahvenin Avrupa\'ya ulaşmasında Osmanlı ve Venedik ticaretinin payı vardır.'},{t:'Java',when:'17. yüzyıl sonu',lat:-6.2,lon:106.8,x:'Hollandalılar 17. yüzyılın sonunda Java\'da kahve plantasyonları kurdu.'},{t:'Pará, Brezilya',when:'1727',lat:-1.45,lon:-48.5,x:'1727\'de kahve fidanları Fransız Guyanası\'ndan Brezilya\'nın Pará bölgesine getirildi. Brezilya sonradan dünyanın en büyük kahve üreticisi oldu.'}]},
{id:'ipek-yolu',w:'İpek Yolu',c:['k'],def:'Çin\'i Akdeniz dünyasına bağlayan; ipeğin yanında fikirlerin de dolaştığı ticaret ağı.',origin:'Terim, 1877\'de Alman coğrafyacı Ferdinand von Richthofen tarafından "Seidenstraße" olarak kullanıldı. Tek bir yol değil, bir ağdı.',story:['İpek Yolu, tek bir yol değil, kara ve deniz bağlantılarından oluşan bir ağdı. İpeğin yanında kağıt, cam, baharat, din ve fikirler de bu ağ boyunca yayıldı.'],facts:['İpek Yolu adı, bu ağ işlerliğini yitirdikten çok sonra, 19. yüzyılda ortaya atıldı.'],src:['UNESCO, Silk Roads programı (en.unesco.org/silkroad)','en.wikipedia.org/wiki/Silk_Road'],intro:'Yüzyıllar boyunca farklı toplumları birbirine bağlayan ticaret ağının hikayesi.',outro:'Gördüğünüz çizgi, ağın tek bir olası hattıdır. Gerçekte birçok kol vardı.',stops:[{t:'Chang\'an (Xi\'an)',when:'Han dönemi',lat:34.34,lon:108.94,x:'Han döneminde başkent. Zhang Qian\'ın İ.Ö. 2. yüzyılda Batı\'ya gönderilen elçilik seferi, Çin\'in Orta Asya ile bağlantısını genişletti.'},{t:'Dunhuang',when:'Çölün kapısı',lat:40.14,lon:94.66,x:'Mogao Mağaraları\'ndaki el yazmaları ve duvar resimleri, yolun kültürel çeşitliliğini gösterir.'},{t:'Kaşgar',when:'Orta Asya eşiği',lat:39.47,lon:75.99,x:'Taklamakan Çölü\'nün kuzey ve güney kollarının birleştiği, dağ geçitleriyle Orta Asya\'ya çıkılan merkez.'},{t:'Semerkant',when:'Sogd tüccarları',lat:39.65,lon:66.96,x:'Sogdlu tüccarların önemli merkezi. Anlatıya göre kağıt yapımı Orta Asya\'ya 8. yüzyılda buradan yayıldı. Ayrıntılar tartışmalıdır.'},{t:'Antakya',when:'Roma dönemi',lat:36.2,lon:36.16,x:'Roma döneminde Doğu mallarının Akdeniz\'e açıldığı büyük şehirlerden biri.'}]},
{id:'el-yazmasi',w:'El yazması',c:['k'],def:'Matbaadan önce, elle çoğaltılan kitap ve metinler.',origin:'Latince manuscriptum (manu scriptus, "elle yazılmış") sözcüğünün Türkçe karşılığıdır.',story:['Matbaa yaygınlaşana kadar kitaplar katipler tarafından tek tek kopyalanıyordu. Bir kitabın nüshası kadar, kopyalayanın emeği de değerliydi.','Yaklaşık 1. ve 4. yüzyıllar arasında Roma dünyasında rulo yerini yavaş yavaş kodekse, yani sayfaları ciltlenmiş kitaba bıraktı.','Parşömen hayvan derisinden, kağıt bitki liflerinden yapılır. Kağıt Çin\'den İslam dünyası üzerinden Avrupa\'ya ulaştı.'],facts:['Avrupa\'da matbaa 1450\'li yıllarda kullanılmaya başladı. El yazması üretimi ondan sonra da uzun süre sürdü.'],src:['British Library, manuscripts guides','en.wikipedia.org/wiki/Manuscript'],stops:null},
{id:'tutsu',w:'Tütsü',c:['p','k'],def:'Yakıldığında koku ve duman yayan reçine, ağaç, kök ve otlar.',origin:'Tütmek (duman çıkarmak) fiilinden türetildiği düşünülür. Parfüm sözcüğünün Latince per fumum ("duman yoluyla") ifadesine bağlandığı sık anlatılır, ancak bu köken kesin değildir.',story:['Tütsü, ibadetlerde, saraylarda ve evlerde binlerce yıldır kullanılır. En tanınmış hammaddelerinden kündür, Boswellia ağaçlarının reçinesidir.','Umman\'ın Dhofar bölgesi ve Somali, kündür ağaçlarıyla tanınır. Arap Yarımadası\'ndan Akdeniz\'e uzanan tütsü ticareti, yol üzerindeki kentlerin gelişmesini sağladı.'],facts:['Negev\'deki tütsü yolu kentleri 2005\'te UNESCO Dünya Mirası listesine alındı.'],src:['UNESCO, Incense Route - Desert Cities in the Negev','en.wikipedia.org/wiki/Incense_route'],intro:'Çöllerden geçen kokulu bir ticaretin hikayesi.',outro:'Rota yaklaşıktır. Kervan yolları tek bir hat değildi.',stops:[{t:'Dhofar, Umman',when:'Kündür vadileri',lat:17.02,lon:54.09,x:'Kündür ağaçlarının yetiştiği kıyı bölgesi. Reçine buradan kervanlarla kuzeye taşındı.'},{t:'Petra',when:'Nabati kenti',lat:30.33,lon:35.44,x:'Nabatilerin ticaret merkezi. Çöl yollarının kavşağında zenginleşti.'},{t:'Gazze',when:'Akdeniz limanı',lat:31.5,lon:34.47,x:'Akdeniz limanı. Tütsü ve baharat buradan Akdeniz dünyasına dağıtıldı.'}]},
{id:'kiragi',w:'Kırağı',c:['w'],def:'Soğuk, açık gecelerde yüzeylerde oluşan ince buz kristalleri tabakası.',origin:'Türkçe bir sözcüktür. Ayrıntılı etimolojisi bu içerikte doğrulanmamıştır.',story:['Kırağı, havadaki su buharının sıcaklığı 0 derecenin altındaki yüzeylerde doğrudan buz kristallerine dönüşmesiyle oluşur. Bilimde buna depozisyon denir.','Genellikle açık, durgun ve soğuk gecelerde, yüzey hava sıcaklığından daha fazla soğuduğunda görülür.'],facts:['Kırağı düşen sabahlar, bitkiler için don riski taşıyan sabahlardır.'],src:['en.wikipedia.org/wiki/Hoarfrost','Meteoroloji kuruluşlarının sözlükleri'],stops:null}];
const $=s=>document.querySelector(s),byId=id=>W.find(w=>w.id===id);
const ls={get:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const pad=n=>String(n).padStart(2,'0'),today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const trD=s=>{const[y,m,d]=s.split('-');return new Date(y,m-1,d).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',weekday:'long'})};
function ensureToday(){const log=ls.get('log',[]),t=today();let e=log.find(x=>x.d===t);if(!e){const seen=log.map(x=>x.id);let c=W.filter(w=>!seen.includes(w.id));if(!c.length){const r=log.slice(-3).map(x=>x.id);c=W.filter(w=>!r.includes(w.id))}let h=0;for(const ch of t)h=(h*31+ch.charCodeAt(0))>>>0;e={d:t,id:c[h%c.length].id};log.push(e);ls.set('log',log)}return e}
const favs=()=>ls.get('fav',[]),isF=id=>favs().includes(id);
function toggleF(id){let f=favs();f=f.includes(id)?f.filter(x=>x!==id):[...f,id];ls.set('fav',f);render();if($('#ov').classList.contains('on'))detail(id)}
const col=w=>CATS[w.c[0]][1],catT=w=>w.c.map(c=>CATS[c][0]).join(' · ');
const heart=id=>`<button class="heart ${isF(id)?'on':''}" aria-label="Favori" onclick="toggleF('${id}')">${isF(id)?'♥':'♡'}</button>`;
let tab='today';
function item(w,d){return `<div class="item" style="--acc:${col(w)};border-color:${col(w)}" onclick="detail('${w.id}')"><b>${w.w}</b> <span style="float:right;color:${isF(w.id)?'#d9694f':'#6b5a44'}">♥</span><small>${catT(w)}${d?' · '+trD(d):''}</small>${w.def}</div>`}
function render(){const e=ensureToday(),w=byId(e.id),m=$('#m');
 $('#nv').innerHTML=[['today','Bugün'],['past','Geçmiş'],['fav','Favoriler']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');
 if(tab==='today'){m.style.setProperty('--acc',col(w));m.innerHTML=`<div class="top"><span>Günün Kelimesi</span><span>${trD(e.d).split(' ').slice(0,2).join(' ')}</span></div><p style="color:var(--mut);margin:26px 0 0">Bugünün Kelimesi</p><h1 class="big">${w.w}</h1><span class="chip">${catT(w)}</span><p class="def">${w.def}</p><div class="row"><button class="pri" onclick="detail('${w.id}')">Keşfet</button>${heart(w.id)}</div><svg class="orn" viewBox="0 0 140 20"><path d="M0 10H55M85 10H140" stroke="currentColor"/><path d="M70 2l8 8-8 8-8-8z" fill="none" stroke="currentColor"/></svg>`}
 else if(tab==='past'){const L=ls.get('log',[]).slice().sort((a,b)=>b.d<a.d?-1:1);m.innerHTML=`<h2 style="margin-bottom:14px">Geçmiş kelimeler</h2>`+L.map(x=>item(byId(x.id),x.d)).join('')}
 else{const f=favs().map(byId).filter(Boolean);m.innerHTML=`<h2 style="margin-bottom:14px">Favoriler</h2>`+(f.length?f.map(w=>item(w)).join(''):`<div class="empty">Henüz favori kelimen yok.<br>Beğendiğin bir kelimenin yanındaki kalbe dokun, burada saklansın.</div>`)}}
function detail(id){const w=byId(id),o=$('#ov');o.className='ov on';o.style.setProperty('--acc',col(w));
 o.innerHTML=`<div class="bar"><button onclick="$('#ov').className='ov'">‹ Geri</button>${heart(id)}</div><div class="sc"><h1 class="big" style="font-size:2.4rem;margin-top:0">${w.w}</h1><span class="chip">${catT(w)}</span><div class="sec" style="margin-top:18px"><h3>Anlamı</h3><p>${w.def}</p><p class="src">Köken: ${w.origin}</p></div>${w.stops?`<button class="pri" style="margin-bottom:22px" onclick="story('${id}')">Yolculuğu haritada izle</button>`:''}<div class="sec"><h3>Hikayesi</h3>${w.story.map(p=>`<p>${p}</p>`).join('')}</div><div class="sec"><h3>İlginç bilgiler</h3>${w.facts.map(p=>`<p>${p}</p>`).join('')}</div><div class="sec"><h3>Kaynaklar</h3>${w.src.map(p=>`<p class="src">${p}</p>`).join('')}</div></div>`}
const POLY={af:[[-17,21],[-10,30],[-6,36],[10,37],[11,33],[20,31],[32,31],[35,28],[43,12],[51,12],[40,-3],[40,-15],[35,-24],[32,-29],[20,-35],[17,-30],[12,-17],[13,-6],[9,4],[-8,4],[-17,14]],eu:[[-10,36],[-9,43],[-1,46],[-5,48],[3,51],[8,54],[10,58],[5,62],[15,69],[30,71],[60,69],[80,73],[110,77],[140,72],[170,70],[180,66],[160,60],[155,51],[142,53],[140,45],[130,42],[127,39],[126,35],[122,40],[121,31],[118,24],[108,21],[106,10],[100,13],[103,2],[98,8],[94,17],[88,22],[80,15],[77,8],[73,17],[67,25],[57,25],[56,27],[50,30],[48,29],[56,22],[59,22],[52,16],[43,13],[39,21],[35,28],[34,31],[36,36],[28,36.5],[26,39],[23,36.5],[20,40],[19,42],[13,45.5],[16,41],[16,38],[12,42],[8,44],[3,43],[0,39],[-5,36.5],[-9,37]],na:[[-168,66],[-140,70],[-95,72],[-80,63],[-62,58],[-55,50],[-67,45],[-76,38],[-81,31],[-80,25],[-90,30],[-97,26],[-97,20],[-87,21],[-83,10],[-79,8],[-92,14],[-105,20],[-110,23],[-117,32],[-124,40],[-125,49],[-140,60],[-152,59],[-166,60]],sa:[[-78,8],[-72,12],[-62,10],[-50,0],[-35,-6],[-40,-22],[-48,-28],[-58,-38],[-65,-42],[-68,-52],[-74,-50],[-72,-30],[-70,-18],[-81,-6],[-80,0]],au:[[114,-22],[122,-18],[130,-12],[137,-12],[142,-11],[146,-19],[153,-26],[150,-37],[141,-38],[135,-35],[130,-32],[115,-34]],gl:[[-55,60],[-45,60],[-20,70],[-20,82],[-60,82],[-70,76]],ja:[[130,32],[135,34],[140,36],[142,40],[140,43],[136,37]],id:[[95,5],[105,-6],[106,-7],[100,-1]],jv:[[105,-6],[114,-8],[106,-8]]};
const PX=(lo,la)=>[(lo+180)*5,(90-la)*5],NS='http://www.w3.org/2000/svg';
function story(id){const w=byId(id),S=w.stops,st=$('#st');st.className='ov on';st.style.setProperty('--acc',col(w));
 const steps=[{o:1,t:'Genel görünüm',x:w.intro},...S.map((s,i)=>({...s,i})),{o:1,t:'Genel bakış',x:w.outro}];let n=0,cam={x:900,y:450,w:1800},raf;
 st.innerHTML=`<div class="bar"><button onclick="$('#st').className='ov'">‹ Kapat</button><span id="sp" style="color:var(--mut)"></span></div><svg id="mp" preserveAspectRatio="xMidYMid slice"></svg><div class="sc" id="sc"></div><div class="ctl"><button class="ghost" id="sb">Geri</button><button class="ghost" id="sr" aria-label="Yeniden oynat">↻</button><button class="pri" id="sn">İleri</button></div>`;
 const svg=$('#mp');let h='';for(let lo=-180;lo<=180;lo+=30){const x=(lo+180)*5;h+=`<line class="grat" x1="${x}" y1="0" x2="${x}" y2="900"/>`}for(let la=-60;la<=60;la+=30){const y=(90-la)*5;h+=`<line class="grat" x1="0" y1="${y}" x2="1800" y2="${y}"/>`}
 for(const k in POLY)h+=`<polygon class="land" points="${POLY[k].map(p=>PX(...p).join(',')).join(' ')}"/>`;
 const P=S.map(s=>PX(s.lon,s.lat));P.slice(1).forEach((p,j)=>{h+=`<path class="rt" pathLength="1" d="M${P[j]}L${p}"/>`});
 P.forEach((p,i)=>{h+=`<g class="m"><circle class="mk" cx="${p[0]}" cy="${p[1]}"/><circle class="ring" cx="${p[0]}" cy="${p[1]}" style="display:none"/><text class="lb" x="${p[0]}" y="${p[1]}">${S[i].t.split(' (')[0]}</text></g>`});svg.innerHTML=h;
 const rt=[...svg.querySelectorAll('.rt')],mg=[...svg.querySelectorAll('.m')];
 function ap(){const r=(svg.clientWidth||360)/(svg.clientHeight||300);svg.setAttribute('viewBox',`${cam.x-cam.w/2} ${cam.y-cam.w/r/2} ${cam.w} ${cam.w/r}`);const k=cam.w/1800;mg.forEach((g,i)=>{const c=g.children[0],ri=g.children[1],t=g.children[2];[c,ri].forEach(e=>e.setAttribute('r',Math.max(k*38,2)));ri.setAttribute('r',Math.max(k*70,3));t.setAttribute('font-size',Math.max(k*70,3));t.setAttribute('dx',k*50)})}
 function target(i){const s=steps[i];const r=(svg.clientWidth||360)/(svg.clientHeight||300);if(s.o||!P.length){const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),sx=Math.max(...xs)-Math.min(...xs),sy=Math.max(...ys)-Math.min(...ys);return{x:(Math.max(...xs)+Math.min(...xs))/2,y:(Math.max(...ys)+Math.min(...ys))/2,w:Math.max(sx*1.5,sy*1.5*r,320)}}const c=P[s.i],q=P[Math.max(s.i-1,0)];return{x:c[0],y:c[1],w:Math.max(300,Math.abs(c[0]-q[0])*1.6,Math.abs(c[1]-q[1])*1.6*r)}}
 function fly(t,d=1500){cancelAnimationFrame(raf);const f={...cam},t0=performance.now();(function f2(now){const u=Math.min((now-t0)/d,1),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;cam={x:f.x+(t.x-f.x)*e,y:f.y+(t.y-f.y)*e,w:f.w*Math.pow(t.w/f.w,e)};ap();if(u<1)raf=requestAnimationFrame(f2)})(t0)}
 function go(i){n=i;const s=steps[i],last=i===steps.length-1;rt.forEach((e,j)=>e.classList.toggle('on',i>=j+2||last));
  mg.forEach((g,j)=>{const on=i>=j+1||last,cur=!s.o&&s.i===j;g.children[0].setAttribute('class','mk'+(on?' on':'')+(cur?' cur':''));g.children[1].style.display=cur?'':'none';g.children[2].style.display=on?'':'none'});
  $('#sc').innerHTML=`<h2>${s.t}</h2>${s.when?`<small>${s.when}</small>`:''}<p>${s.x}</p>`;$('#sc').scrollTop=0;$('#sp').textContent=s.o?'':`${s.i+1} / ${S.length} durak`;
  $('#sb').disabled=i===0;$('#sn').disabled=last;fly(target(i))}
 $('#sb').onclick=()=>go(n-1);$('#sn').onclick=()=>go(n+1);$('#sr').onclick=()=>{cam={x:900,y:450,w:1800};go(0)};ap();go(0)}
window.onBack=()=>{if($('#st').classList.contains('on')){$('#st').className='ov';return true}if($('#ov').classList.contains('on')){$('#ov').className='ov';return true}if(tab!=='today'){tab='today';render();return true}return false};
render();
</script></body></html>
